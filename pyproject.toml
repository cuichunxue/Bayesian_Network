[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-network-analyzer"
version = "1.3.0"
description = "Production-grade Bayesian Network structure learning, inference, and visualization toolkit"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "networkx>=3.0,<4.0",
    "plotly>=5.15,<6.0",
    "pgmpy>=0.1.25",
    "scikit-learn>=1.3,<2.0",
    "flask>=2.3,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["bayesian_network*"]
